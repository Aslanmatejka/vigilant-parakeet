[pytest]
testpaths = backend/ai/tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning

# Live / e2e suites that require a running backend or network.
# Run explicitly: pytest -m live
markers =
    live: requires live backend / external services

# Default suite stays hermetic: exclude live module paths.
norecursedirs = .git .tox dist node_modules
addopts =
    -q
    --strict-markers
    --ignore=backend/tests/test_spec_coverage.py
    --ignore=backend/tests/test_claim_flow.py
    --ignore=backend/tests/test_share_flow.py
    --ignore=backend/tests/test_granny_chat.py
    --ignore=backend/tests/test_voice_live.py
