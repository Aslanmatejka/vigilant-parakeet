# DoGoods CI/CD
#
# CI (every push/PR to master|main|develop):
#   - Frontend: lint → test → build
#   - Backend: hermetic pytest
#   - Security: npm audit (advisory, non-blocking)
#
# CD (push to master only, after CI green):
#   - Frontend → Netlify production (dogoods.store)
#   - Backend  → Railway production (dogoods-backend)
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  — https://app.netlify.com/user/applications#personal-access-tokens
#   NETLIFY_SITE_ID     — Site settings → Site information → Site ID (dogoods)
#   RAILWAY_TOKEN       — Railway → Project → Settings → Tokens (project token)
#
# Optional repository variables (Settings → Variables):
#   RAILWAY_PROJECT_ID     default: cbd9e9c8-c48b-4c8b-9a88-0e3b6c2dfb8c
#   RAILWAY_SERVICE_NAME   default: dogoods-backend
#   RAILWAY_ENVIRONMENT    default: production

name: CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    # Public client keys (same as netlify.toml) so CI artifact is production-ready.
    env:
      VITE_SUPABASE_URL: https://ifzbpqyuhnxbhdcnmvfs.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmemJwcXl1aG54YmhkY25tdmZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYwNTI5NTgsImV4cCI6MjA3MTYyODk1OH0.ivjNXt8z704sVv6Jt2Z3tVkkelUzeb8Ih4SaCQFHerk
      VITE_MAPBOX_TOKEN: pk.eyJ1Ijoic2lnbndpc2UiLCJhIjoiY21rc2tjNjQ3MGFjajNkcHJ1cTNsbWV6dyJ9.xbJQFP3HCM2jmG87wvwC1Q
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Hermetic pytest
        env:
          AI_REQUIRE_AUTH: "false"
          JWT_SECRET: "ci-test-jwt-secret-min-16"
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest

  # Advisory only — do not block deploys on transitive advisories alone
  security-advisory:
    name: Security advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  deploy-frontend:
    name: Deploy Frontend (Netlify)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing secret NETLIFY_AUTH_TOKEN"
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Missing secret NETLIFY_SITE_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # --no-build: ship the CI-built artifact as-is; do NOT trigger Netlify's
        # remote build (site UI still has "npm run build" configured, which
        # would fail here since only dist/ is present).
        run: netlify deploy --prod --dir=dist --no-build --message "CI/CD ${GITHUB_SHA}"

  deploy-backend:
    name: Deploy Backend (Railway)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Require Railway secret
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing secret RAILWAY_TOKEN"
            echo "Create a project token: Railway → Project → Settings → Tokens"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          PROJECT_ID="${RAILWAY_PROJECT_ID:-cbd9e9c8-c48b-4c8b-9a88-0e3b6c2dfb8c}"
          SERVICE="${RAILWAY_SERVICE:-dogoods-backend}"
          ENVIRONMENT="${RAILWAY_ENVIRONMENT:-production}"
          railway up \
            -d \
            -c \
            -m "CI/CD ${GITHUB_SHA}" \
            -s "$SERVICE" \
            -e "$ENVIRONMENT" \
            -p "$PROJECT_ID"
      - name: Health check
        run: |
          url="https://dogoods-backend-production.up.railway.app/api/ai/health"
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 18); do
            body="$(curl -fsS "$url" 2>/dev/null || true)"
            echo "attempt $i: $body"
            if echo "$body" | grep -Eq 'openai_configured|"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Backend healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Health check did not confirm readiness within ~3 minutes. Check Railway logs."
          exit 0
